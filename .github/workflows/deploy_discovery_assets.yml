name: Deploy Discovery Assets Only
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Exact current sites/circum-2797c/versions/... to preserve"
        required: true
        type: string
concurrency:
  group: public-website-discovery-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s lib/website/tooling -p 'test_release_discovery_assets.py'
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
          token_format: access_token
      - name: Clone current public Hosting version and replace approved assets only
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python lib/website/tooling/release_discovery_assets.py --expected-version "$EXPECTED_VERSION" --evidence-dir release-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-hosting-release
          path: release-evidence/
