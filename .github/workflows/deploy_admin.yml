name: Deploy Admin

on:
  workflow_dispatch:

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=admin --base HEAD
      - run: flutter test test/admin_operations_test.dart
      - run: CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" scripts/build_admin_web.sh
      - run: node scripts/validate_web_artifacts.js --surface=admin
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web-release
          path: build/web_admin
