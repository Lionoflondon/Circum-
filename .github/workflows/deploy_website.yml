name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      enable_roth_test:
        description: "Enable approved isolated ROTH TEST checkout only"
        required: true
        default: false
        type: boolean
      enable_roth_live:
        description: "Enable public LIVE only after exact-source production certification"
        required: true
        default: false
        type: boolean
      enable_roth_live_candidate:
        description: "Publish restricted LIVE certification page; public LIVE remains disabled"
        required: true
        default: false
        type: boolean
      roth_test_runtime_sha:
        description: "Previously certified TEST runtime SHA, only for supplemental LIVE candidate release"
        required: false
        default: ""
        type: string
      certified_live_runtime_sha:
        description: "Existing certified LIVE backend SHA for website-only releases with unchanged backend source"
        required: false
        default: ""
        type: string
      enable_newsletter:
        description: "Enable the approved newsletter signup surface"
        required: true
        default: true
        type: boolean

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node --test lib/website/tooling/public_site_seo.test.cjs
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=website --base HEAD
      - run: flutter test test/web_artifact_isolation_test.dart test/web_platform_routing_test.dart
      - run: WEBSITE_ROTH_TEST_ENABLED="${{ inputs.enable_roth_test }}" WEBSITE_ROTH_LIVE_CANDIDATE_ENABLED="${{ inputs.enable_roth_live_candidate }}" WEBSITE_ROTH_LIVE_PUBLIC_ENABLED="${{ inputs.enable_roth_live }}" NEWSLETTER_SIGNUP_ENABLED="${{ inputs.enable_newsletter }}" PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" PUBLIC_WEB_STATIC_MAPS_API_KEY="${{ secrets.PUBLIC_WEB_STATIC_MAPS_API_KEY }}" scripts/build_public_web.sh
      - run: node lib/website/tooling/public_site_seo.cjs build/public_web
      - run: node --test scripts/website_roth_routes.test.mjs
      - run: node scripts/validate_web_artifacts.js --surface=website
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - name: Verify exact isolated ROTH TEST runtime before public release
        if: inputs.enable_roth_test
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CERTIFIED_TEST_SHA: ${{ inputs.roth_test_runtime_sha }}
          LIVE_CANDIDATE: ${{ inputs.enable_roth_live_candidate }}
        run: |
          curl --fail --silent --show-error https://circum-website-roth-test-516426305461.us-central1.run.app/health > /tmp/roth-health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/roth-health.json"));if(h.environment!=="test"||h.sourceSHA!==((process.env.LIVE_CANDIDATE==="true"&&/^[a-f0-9]{40}$/.test(process.env.CERTIFIED_TEST_SHA||""))?process.env.CERTIFIED_TEST_SHA:process.env.EXPECTED_SHA)||!h.ok||!h.isolationVerified)throw Error("Unverified ROTH runtime")'
      - name: Verify restricted LIVE runtime before certification page release
        if: inputs.enable_roth_live_candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error https://circum-website-roth-live-516426305461.us-central1.run.app/health > /tmp/roth-live-health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/roth-live-health.json"));if(h.environment!=="live"||h.sourceSHA!==process.env.EXPECTED_SHA||!h.ok||!h.isolationVerified||h.publicPurchasesEnabled!==false)throw Error("Unverified restricted LIVE runtime")'
      - name: Validate existing certified backend for website-only release
        if: inputs.enable_roth_live && inputs.certified_live_runtime_sha != ''
        env:
          CERTIFIED_SHA: ${{ inputs.certified_live_runtime_sha }}
        run: |
          [[ "$CERTIFIED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$CERTIFIED_SHA" HEAD
          git diff --exit-code "$CERTIFIED_SHA" HEAD -- server scripts/build_public_web.sh web/roth web/roth-live-certification firestore.rules
          node lib/website/tooling/validate_website_hosting_change.cjs "$CERTIFIED_SHA"
      - name: Verify certified public LIVE runtime before activation
        if: inputs.enable_roth_live
        env:
          EXPECTED_SHA: ${{ inputs.certified_live_runtime_sha || github.sha }}
        run: |
          curl --fail --silent --show-error https://circum-website-roth-live-516426305461.us-central1.run.app/health > /tmp/roth-live-public-health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/roth-live-public-health.json"));if(h.environment!=="live"||h.sourceSHA!==process.env.EXPECTED_SHA||!h.ok||!h.isolationVerified||h.publicPurchasesEnabled!==true)throw Error("Uncertified public LIVE runtime")'
      - run: firebase deploy --only hosting:public --project circum-2797c
