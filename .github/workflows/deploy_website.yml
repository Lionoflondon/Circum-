name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      enable_roth_test:
        description: "Enable approved isolated ROTH TEST checkout only"
        required: true
        default: false
        type: boolean
      enable_newsletter:
        description: "Enable the approved newsletter signup surface"
        required: true
        default: true
        type: boolean

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=website --base HEAD
      - run: flutter test test/web_artifact_isolation_test.dart test/web_platform_routing_test.dart
      - run: WEBSITE_ROTH_TEST_ENABLED="${{ inputs.enable_roth_test }}" NEWSLETTER_SIGNUP_ENABLED="${{ inputs.enable_newsletter }}" PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" PUBLIC_WEB_STATIC_MAPS_API_KEY="${{ secrets.PUBLIC_WEB_STATIC_MAPS_API_KEY }}" scripts/build_public_web.sh
      - run: node --test scripts/website_roth_routes.test.mjs
      - run: node scripts/validate_web_artifacts.js --surface=website
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - name: Verify exact isolated ROTH TEST runtime before public release
        if: inputs.enable_roth_test
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error https://circum-website-roth-test-516426305461.us-central1.run.app/health > /tmp/roth-health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/roth-health.json"));if(h.environment!=="test"||h.sourceSHA!==process.env.EXPECTED_SHA||!h.ok)throw Error("Unverified ROTH runtime")'
      - run: firebase deploy --only hosting:public --project circum-2797c
