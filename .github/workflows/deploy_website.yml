name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [fix/stripe-return-product-isolation]

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=website --base HEAD
      - run: flutter pub get
      - run: flutter test test/web_artifact_isolation_test.dart test/web_platform_routing_test.dart
      - run: PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}" scripts/build_public_web.sh
      - run: node scripts/validate_web_artifacts.js --surface=website
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting:public --project circum-2797c
