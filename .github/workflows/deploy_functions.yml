name: Deploy Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: npm --prefix server/functions ci
      - run: npm --prefix server/functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: firebase experiments:enable legacyRuntimeConfigCommands
      - run: firebase functions:config:set google.places_api_key="$GOOGLE_PLACES_API_KEY" --project circum-2797c
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - run: firebase deploy --only functions --project circum-2797c
