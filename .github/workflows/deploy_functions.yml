name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Previous backend release SHA/ref used to compute affected Functions"
        required: true
        type: string
      function_scope:
        description: "Optional comma-separated functions:<export> scope for a protected retry"
        required: false
        default: ""
        type: string

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: npm --prefix server/functions ci
      - run: npm --prefix server/functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: printf "GOOGLE_PLACES_API_KEY=%s\n" "$GOOGLE_PLACES_API_KEY" > server/functions/.env
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Deploy affected Functions
        run: |
          set +e
          if [ -n "${{ inputs.function_scope }}" ]; then
            scope="$(node scripts/validate_functions_deploy_scope.js '${{ inputs.function_scope }}')"
            resolver_status=$?
          else
            scope="$(node scripts/scoped_functions_deploy_list.js --base '${{ inputs.base_ref }}')"
            resolver_status=$?
          fi
          set -e
          if [ "$resolver_status" -ne 0 ] && [ "$resolver_status" -ne 3 ]; then
            echo "Scoped Functions resolver failed with status $resolver_status."
            exit "$resolver_status"
          fi
          if [ "$resolver_status" -eq 0 ] && [ -n "$scope" ]; then
            firebase deploy --only "$scope" --project circum-2797c
          else
            echo "No affected Functions; skipping source deployment."
          fi
      - name: Delete retired Roth Functions when present
        run: |
          set -euo pipefail
          existing="$(firebase functions:list --project circum-2797c --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const ids = new Set((JSON.parse(input).result || []).map(fn => fn.id));
              process.stdout.write(["issueRothCredit", "issueRothToWallets"].filter(id => ids.has(id)).join(" "));
            });
          ')"
          if [ -n "$existing" ]; then
            firebase functions:delete $existing --region us-central1 --project circum-2797c --force
          else
            echo "Retired Roth Functions already absent."
          fi
