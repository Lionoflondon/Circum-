name: Deploy Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: npm --prefix server/functions ci
      - run: npm --prefix server/functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: firebase deploy --only "$(node scripts/scoped_functions_deploy_list.js --only createSenderPaidDelivery,finalizeSenderWebCheckout)" --project circum-2797c
      - run: node scripts/verify_functions_runtime_context.js circum-2797c
