name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma-separated function exports; blank deploys the full backend"
        required: false
        default: ""

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: npm --prefix server/functions ci
      - run: npm --prefix server/functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: printf "GOOGLE_PLACES_API_KEY=%s\n" "$GOOGLE_PLACES_API_KEY" > server/functions/.env
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - run: |
          if [ -n "${{ inputs.functions }}" ]; then
            target="$(node scripts/scoped_functions_deploy_list.js --functions "${{ inputs.functions }}")"
          else
            target="$(node scripts/scoped_functions_deploy_list.js)"
          fi
          echo "Deploying scoped targets: $target"
          firebase deploy --only "$target" --project circum-2797c
