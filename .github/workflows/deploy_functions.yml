name: Deploy Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: npm --prefix server/functions ci
      - run: npm --prefix server/functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm install -g firebase-tools
      - run: printf "GOOGLE_PLACES_API_KEY=%s\n" "$GOOGLE_PLACES_API_KEY" > server/functions/.env
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - run: node scripts/functions_release_provenance.js prepare --out "$RUNNER_TEMP/functions-release-provenance.json"
      - run: node scripts/functions_release_provenance.js guard
      - run: firebase deploy --only "$(node scripts/scoped_functions_deploy_list.js)" --project circum-2797c
      - if: success()
        run: node scripts/functions_release_provenance.js postdeploy --manifest "$RUNNER_TEMP/functions-release-provenance.json" --out "$RUNNER_TEMP/functions-release-provenance.json"
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: functions-release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/functions-release-provenance.json
          if-no-files-found: error
          retention-days: 90
