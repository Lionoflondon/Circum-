name: RC1 Release Build

on:
  workflow_dispatch:

jobs:
  web:
    name: Build Public Website and Sender Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node scripts/deploy_guard.self_test.js
      - run: flutter analyze lib/app/sender_mobile/sender_ui_baseline.dart lib/app/sender_mobile/sender_page_shell.dart lib/app/sender_mobile/sender_mobile_home.dart lib/app/sender_mobile/sender_activity.dart lib/app/sender_mobile/sender_wallet.dart lib/app/sender_mobile/sender_mobile_profile.dart
      - run: flutter test test/sender_mobile/sender_app_boot_contract_test.dart test/sender_mobile/sender_first_frame_layout_test.dart test/sender_mobile/sender_visual_baseline_contract_test.dart
      - run: PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.PUBLIC_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}" scripts/build_public_web.sh
      - run: CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" CIRCUM_WEB_GOOGLE_MAPS_API_KEY="${{ secrets.CIRCUM_WEB_GOOGLE_MAPS_API_KEY }}" STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" scripts/build_sender_app_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: circum-rc1-web-artifacts
          path: |
            build/public_web
            build/sender_app_web

  sender-mobile:
    name: Build Sender Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          test -n "${{ secrets.SENDER_ANDROID_GOOGLE_MAPS_API_KEY }}" || (echo "Missing SENDER_ANDROID_GOOGLE_MAPS_API_KEY" >&2; exit 1)
          test -n "${{ secrets.GOOGLE_MAPS_DIRECTIONS_API_KEY }}" || (echo "Missing GOOGLE_MAPS_DIRECTIONS_API_KEY" >&2; exit 1)
          test -n "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" || (echo "Missing STRIPE_PUBLISHABLE_KEY" >&2; exit 1)
          GOOGLE_MAPS_API_KEY="${{ secrets.SENDER_ANDROID_GOOGLE_MAPS_API_KEY }}" flutter build apk --release --target=lib/main.dart --dart-define=GOOGLE_MAPS_DIRECTIONS_API_KEY="${{ secrets.GOOGLE_MAPS_DIRECTIONS_API_KEY }}" --dart-define=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sender-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
