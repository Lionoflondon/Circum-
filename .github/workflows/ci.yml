name: Circum CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: node scripts/absolute_product_ownership.js
      - run: node scripts/backend_authority_guard.js
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=sender-app --base HEAD
      - run: node scripts/deploy_guard.js --target=website --base HEAD
      - run: node scripts/deploy_guard.js --target=admin --base HEAD
      - run: node scripts/deploy_guard.js --target=backend --base HEAD
      - run: node scripts/validate_sender_mobile_artifacts.js

  functions:
    name: Functions lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix server/functions ci
      - name: Lint changed Functions files
        run: |
          base_ref="${{ github.base_ref || 'main' }}"
          files="$(mktemp)"
          git diff --name-only "origin/${base_ref}...HEAD" \
            -- 'server/functions/*.js' |
          sed 's#^server/functions/##' |
          while IFS= read -r file; do
            if [ -f "server/functions/${file}" ]; then
              printf '%s\n' "${file}"
            fi
          done > "${files}"

          if [ ! -s "${files}" ]; then
            echo "No changed Functions JavaScript files to lint."
            exit 0
          fi

          (cd server/functions && xargs ./node_modules/.bin/eslint < "${files}")
      - run: npm --prefix server/functions test
      - run: npm install -g firebase-tools
      - run: npm --prefix server/functions run test:rules
