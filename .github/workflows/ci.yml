name: Circum CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: node scripts/absolute_product_ownership.js
      - run: node scripts/backend_authority_guard.js
      - run: node scripts/deploy_guard.self_test.js
      - run: node --test scripts/website_roth_routes.test.mjs
      - name: Check offline retry containment safety
        run: node --test tools/retry_containment_check.test.js
      - name: Check Sender application ownership
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy_guard.js --target=sender-app --ci
      - name: Check Website ownership
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy_guard.js --target=website --ci
      - name: Check Admin ownership
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy_guard.js --target=admin --ci
      - name: Check Backend ownership
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy_guard.js --target=backend --ci
      - run: node scripts/validate_sender_mobile_artifacts.js

  functions:
    name: Functions lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix server/functions ci
      - name: Lint changed Functions files
        run: |
          base_ref="${{ github.base_ref || 'main' }}"
          files="$(mktemp)"
          git diff --name-only "origin/${base_ref}...HEAD" \
            -- 'server/functions/*.js' |
          sed 's#^server/functions/##' |
          while IFS= read -r file; do
            if [ -f "server/functions/${file}" ]; then
              printf '%s\n' "${file}"
            fi
          done > "${files}"

          if [ ! -s "${files}" ]; then
            echo "No changed Functions JavaScript files to lint."
            exit 0
          fi

          (cd server/functions && xargs ./node_modules/.bin/eslint < "${files}")
      - run: npm --prefix server/functions test
      - run: npm --prefix server/functions run check:gen1-architecture
      - run: npm install -g firebase-tools
      - name: Detect backend changes requiring Firestore rules tests
        id: backend-rules-scope
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed-files.txt
          if rg -q '^(server/functions/|firestore\.rules$|storage\.rules$|firebase\.json$)' /tmp/changed-files.txt; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Firestore rules emulator suite
        if: steps.backend-rules-scope.outputs.required == 'true'
        run: npm --prefix server/functions run test:rules
      - name: Skip backend emulator suite for non-backend changes
        if: steps.backend-rules-scope.outputs.required != 'true'
        run: echo "No backend, security-rules, or emulator configuration files changed."
      - name: Rider verified onboarding and document integration
        if: steps.backend-rules-scope.outputs.required == 'true'
        run: firebase emulators:exec --project demo-circum-rider-ci --only auth,firestore,storage "node --test --test-concurrency=1 server/functions/rider-onboarding-flow.emulator.test.js server/functions/rider-online-intent.emulator.test.js server/functions/rider-document-emulator-integration.test.js server/functions/storage-rider-document-rules.test.js"
      - name: Skip backend emulator integration for non-backend changes
        if: steps.backend-rules-scope.outputs.required != 'true'
        run: echo "No backend or emulator integration files changed."
