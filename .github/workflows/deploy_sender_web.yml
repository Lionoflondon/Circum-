name: Deploy Sender Web

on:
  workflow_dispatch:
    inputs:
      payment_environment:
        description: Stripe environment for this deployment
        required: true
        type: choice
        default: test
        options:
          - test
          - live

jobs:
  deploy-sender-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=sender-app --base HEAD
      - run: flutter test test/sender_product_isolation_test.dart test/sender_mobile/sender_canonical_destination_guard_test.dart
      - name: Build Sender web with matched Stripe mode
        env:
          PAYMENT_ENVIRONMENT: ${{ inputs.payment_environment }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}
          CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          CIRCUM_WEB_GOOGLE_MAPS_API_KEY: ${{ secrets.CIRCUM_WEB_GOOGLE_MAPS_API_KEY }}
        run: |
          if [[ "$PAYMENT_ENVIRONMENT" == "test" ]]; then
            STRIPE_PUBLISHABLE_KEY="$STRIPE_TEST_PUBLISHABLE_KEY"
          else
            STRIPE_PUBLISHABLE_KEY="$STRIPE_LIVE_PUBLISHABLE_KEY"
          fi
          export STRIPE_PUBLISHABLE_KEY
          scripts/build_sender_app_web.sh
      - run: node scripts/validate_web_artifacts.js --surface=sender-app
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting:app --project circum-2797c
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install chromium
      - run: node test/sender_mobile/sender_browser_smoke.mjs
        env:
          SENDER_BROWSER_BASE_URL: https://circum-app-2797c.web.app/
          SENDER_EXPECTED_SHA: ${{ github.sha }}
          SENDER_BROWSER_ARTIFACT_DIR: build/sender-browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sender-browser-certification
          path: build/sender-browser-artifacts
