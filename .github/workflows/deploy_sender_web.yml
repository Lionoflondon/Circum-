name: Deploy Sender Web

on:
  workflow_dispatch:
  push:
    branches: [fix/stripe-return-product-isolation]

jobs:
  deploy-sender-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: flutter pub get
      - run: node scripts/deploy_guard.self_test.js
      - run: node scripts/deploy_guard.js --target=sender-app --base HEAD
      - run: flutter test test/sender_product_isolation_test.dart test/sender_mobile/sender_canonical_destination_guard_test.dart test/sender_mobile/sender_stripe_return_routing_test.dart
      - run: CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.CIRCUM_WEB_RECAPTCHA_ENTERPRISE_SITE_KEY }}" CIRCUM_WEB_GOOGLE_MAPS_API_KEY="${{ secrets.CIRCUM_WEB_GOOGLE_MAPS_API_KEY }}" STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" scripts/build_sender_app_web.sh
      - run: node scripts/validate_web_artifacts.js --surface=sender-app
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCUM_2797C }}
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting:app --project circum-2797c
